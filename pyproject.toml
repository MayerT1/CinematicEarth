[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CinematicEarth"
version = "0.3.0"
description = "Cinematic multi-stop flyovers for Google Earth Studio: stop list + camera moves + GeoTIFF products (2D/3D KML) -> .esp project, KML tour, annotated MP4"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Mayer", email = "tjm0042@uah.edu" }]
keywords = ["google earth studio", "esp", "flyover", "kml", "kmz", "geotiff", "geospatial", "animation", "3d"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Multimedia :: Video",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
yaml = ["pyyaml"]
plot = ["matplotlib"]
video = ["opencv-python-headless", "pillow", "tqdm", "imageio-ffmpeg"]
layers = ["rasterio", "matplotlib", "pillow", "gdown"]
all = ["pyyaml", "matplotlib", "opencv-python-headless", "pillow", "tqdm", "imageio-ffmpeg", "rasterio", "gdown"]
dev = ["pytest", "pyyaml", "matplotlib", "opencv-python-headless", "pillow", "tqdm", "imageio-ffmpeg", "rasterio", "gdown"]

[project.scripts]
cinematicearth = "cinematicearth.cli:main"

[project.urls]
Homepage = "https://github.com/MayerT1/CinematicEarth"
Repository = "https://github.com/MayerT1/CinematicEarth"
Issues = "https://github.com/MayerT1/CinematicEarth/issues"
Colab = "https://colab.research.google.com/github/MayerT1/CinematicEarth/blob/main/examples/CinematicEarth_colab.ipynb"

[tool.setuptools.packages.find]
where = ["src"]
